
query fetchLocations {
  fetchLocations {
    uuid
    imageData
    isRecommended
    isEnabled
    typeNum
    latLng {
      lat
      lng
    }
    createdAt
    createdBy {
      name
    }
    locationRatings {
      guestUuid
      rating
    }
    localizations {
      uuid
      audioData
      locationDescription
      locationTitle
      language {
        uuid
        code
      }
    }
  }
}